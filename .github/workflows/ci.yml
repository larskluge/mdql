name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand, on any branch: how a runner change is tried before it lands.
  workflow_dispatch:

jobs:
  build-and-test:
    # An allowlist: a push, a manual dispatch, or a pull request from a branch of
    # this repo runs on the on-demand Tart runner on the maintainer's Mac
    # (larskluge/tart-ci); anything else — a fork's PR, a PR whose head repo was
    # deleted, any event added later — goes to GitHub's hosted runner, so a fork's
    # PR still gets CI without borrowing the Mac. The PR test is the one
    # tart-ci-demand applies (head repo == this repo), so nothing is routed to a
    # runner that would refuse it and leave the job queued.
    #
    # Coverage, not a guard. A fork's PR runs the fork's copy of this file and can
    # ask for `tart`; the runner is minted on the repo, and GitHub may hand it that
    # job when a legitimate one is queued beside it. The boundary is the fork-PR
    # approval click (policy: all_external_contributors). Before approving a fork's
    # run, read any change under .github/workflows/ that asks for `tart`.
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","macOS","arm64","tart"]') || fromJSON('["macos-latest"]') }}
    # A ceiling, not an estimate: hosted runs took 1-2.5 minutes (2026), and the
    # Tart VM starts cold (no DerivedData, swift-markdown fetched afresh). Well under
    # the runner's 90-minute MAX_JOB_SECONDS.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Before the build, for the reason the Makefile gives: this suite needs
      # nothing installed and takes milliseconds, and a broken bump tool should not
      # be discovered twenty minutes into an xcodebuild. It also carries
      # test_the_repositorys_own_pbxproj_is_sound, the only check anywhere that a
      # target-level MARKETING_VERSION has not been added to shadow the project-level
      # one — a PR doing that leaves one target shipping a stale number with every
      # build in this file still green.
      - name: Test the version tooling
        run: make version-test

      # Nothing below is piped. Both steps used to read
      # `xcodebuild … | xcpretty || xcodebuild …`, and neither half did what it looks
      # like it does: a pipeline exits with its *last* command's status, xcpretty
      # exits 0 on any log it can read, so the step was green whatever xcodebuild
      # said — and the `||` fallback, which exists to rerun the command when xcpretty
      # is missing, therefore never ran either. A prettier log is not worth a job
      # that cannot fail; xcodebuild's own exit status is the step's now.
      - name: Build
        run: xcodebuild build -project mdql.xcodeproj -scheme mdql -destination "platform=macOS"

      # `make test`, not a second copy of the xcodebuild invocation. The copy that
      # used to be here named `-scheme mdqlTests` — that is a *target*; the only
      # scheme that runs the suite is `mdql`. Masked by the pipeline above, the error
      # was invisible, so the 116 tests ran on no push and no pull request while every
      # run reported success. A single entry point cannot drift from itself, and it is
      # the one a developer runs locally. It repeats `version-test` in milliseconds,
      # which is a cheaper duplicate than a second xcodebuild line free to disagree
      # with the Makefile's.
      - name: Run tests
        run: make test
